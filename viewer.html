<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Viewer</title>

<style>
html,body{
    margin:0;
    height:100%;
    background:#111;
    overflow:hidden;
}

/* Wrapper allows scroll when zoomed */
.viewer-wrapper{
    position:fixed;
    inset:0;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* PDF container */
.pdf-container{
    transform-origin: top center;
}

/* iframe */
iframe{
    width:1000px;        /* base width */
    height:100vh;
    border:none;
}

/* Zoom buttons */
.controls{
    position:fixed;
    top:20px;
    left:20px;
    z-index:9999;
}

.controls button{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    font-size:22px;
    margin-right:10px;
    cursor:pointer;
    background:#2563eb;
    color:#fff;
}
</style>
</head>

<body>

<div class="controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="zoomIn()">+</button>
</div>

<div class="viewer-wrapper">
    <div class="pdf-container" id="pdfContainer">
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const file = params.get("file");

document.getElementById("pdfFrame").src =
file + "#toolbar=0&navpanes=0";

let zoomLevel = 1;

function zoomIn(){
    zoomLevel += 0.2;
    document.getElementById("pdfContainer").style.transform =
        "scale(" + zoomLevel + ")";
}

function zoomOut(){
    zoomLevel = Math.max(0.6, zoomLevel - 0.2);
    document.getElementById("pdfContainer").style.transform =
        "scale(" + zoomLevel + ")";
}
</script>

</body>
</html>
